{% macro status_badge(status) -%}
<span class="badge badge-{{ status }}" data-status-badge>{{ STATUS_LABELS.get(status, status) }}</span>
{%- endmacro %}

{% macro kind_tag(kind) -%}
<span class="tag tag-{{ kind }}">{{ KIND_LABELS.get(kind, kind) }}</span>
{%- endmacro %}

{% macro csrf_field() -%}
<input type="hidden" name="csrf" value="{{ csrf }}">
{%- endmacro %}

{% macro form_error(error) -%}
{% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
{%- endmacro %}
