{% extends "auth_base.html" %}
{% from "_macros.html" import csrf_field, form_error with context %}
{% block title %}初始化{% endblock %}
{% block auth_form %}
  <h1>初始化 BookSmith</h1>
  <p class="muted">系统里还没有账号。输入服务启动日志里打印的一次性 <b>setup token</b>，然后设置你自己的管理员账号和密码。</p>
  {{ form_error(error) }}
  <form method="post" action="{{ base }}/setup" class="form">
    {{ csrf_field() }}
    <label>Setup token
      <input name="token" required autocomplete="off" spellcheck="false" class="mono">
    </label>
    <label>管理员用户名
      <input name="username" required value="{{ username or '' }}" autocomplete="username" maxlength="32">
    </label>
    <label>密码 <span class="hint">至少 8 位</span>
      <input name="password" type="password" required minlength="8" autocomplete="new-password">
    </label>
    <label>再输一次密码
      <input name="password2" type="password" required minlength="8" autocomplete="new-password">
    </label>
    <button type="submit" class="btn btn-primary btn-block">创建管理员</button>
  </form>
{% endblock %}
