# BookSmith 入口：80 端口（ACME 验证 + 跳转/代理），443 端口（HTTPS）
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream booksmith_app { server 127.0.0.1:8100; keepalive 8; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }

    include /etc/nginx/snippets/booksmith-http.conf;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/booksmith.crt;
    ssl_certificate_key /etc/nginx/ssl/booksmith.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;

    include /etc/nginx/snippets/booksmith-locations.conf;
}
